<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="amberGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Amber rounded-square tile (no rotation - cleaner at tiny sizes) -->
  <rect x="32" y="32" width="448" height="448" rx="120" ry="120" fill="url(#amberGrad2)"/>

  <!-- Bold simplified globe: thick white ring + single meridian + single equator -->
  <!-- white circle base -->
  <circle cx="256" cy="256" r="150" fill="#FFFFFF"/>
  <!-- amber meridian (vertical ellipse) -->
  <ellipse cx="256" cy="256" rx="62" ry="150" fill="none" stroke="#F59E0B" stroke-width="22"/>
  <!-- amber equator (horizontal) -->
  <line x1="106" y1="256" x2="406" y2="256" stroke="#F59E0B" stroke-width="22"/>
  <!-- amber outline ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#F59E0B" stroke-width="22"/>
</svg>
